services:
  postgres:
    image: postgres:16-alpine
    container_name: taskflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - taskflow-postgres-data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    container_name: taskflow-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - keycloak-data:/opt/keycloak/data
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"

  redis:
    image: redis:7-alpine
    container_name: taskflow-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    #volumes:
    #  - redis-data:/data

  localstack:
    image: localstack/localstack
    container_name: taskflow-localstack
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    environment:
      - SERVICES=dynamodb
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
      - PERSISTENCE=1
    volumes:
      - ./docker/localstack-init/init-dynamodb.sh:/etc/localstack/init/ready.d/init-dynamodb.sh
      - localstack-data:/var/lib/localstack

volumes:
  taskflow-postgres-data:
  keycloak-data:
  #redis-data:
  localstack-data:
