global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'taskflow-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ '172.23.0.1:8080' ]
# Si la app pasa a correr como servicio en Compose, cambiar el target de host.docker.internal:8080/'172.23.0.1:8080' a <nombre-del-servicio>:8080